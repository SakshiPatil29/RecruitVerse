services:

  # Optional PostgreSQL — only needed if USE_DATABASE=true.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitverse
    ports:
      - "5432:5432"
    volumes:
      - recruitverse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Streamlit ATS UI (the recruiter-facing app).
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Session-only by default; set USE_DATABASE=true to persist to db above.
      USE_DATABASE: "false"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recruitverse
      # Point at a host-run Ollama; adjust for your platform.
      OLLAMA_HOST: http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy

  # FastAPI service (optional programmatic access to the same pipeline).
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434

volumes:
  recruitverse_pg_data:
