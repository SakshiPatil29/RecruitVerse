services:

  # Optional PostgreSQL — only needed if USE_DATABASE=true.
  # The pgvector image is PostgreSQL 16 plus the pgvector extension, which the
  # candidate search needs (sql/schema.sql runs CREATE EXTENSION vector).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitverse
    ports:
      - "5432:5432"
    volumes:
      - recruitverse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Streamlit ATS UI (the recruiter-facing app).
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Session-only by default; set USE_DATABASE=true to persist to db above.
      USE_DATABASE: "false"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recruitverse
      # Groq API key for AI narrative features; falls back to rule-based
      # text if unset. Set via a .env file or your shell — never hardcode it.
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  # FastAPI service (optional programmatic access to the same pipeline).
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}

volumes:
  recruitverse_pg_data:
